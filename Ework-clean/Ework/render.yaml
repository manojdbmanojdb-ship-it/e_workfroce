services:
  # Backend Web Service (Node.js Express + SQLite + WebSocket)
  - type: web
    name: ework-backend
    env: node
    plan: free
    rootDir: Ework-clean/Ework/backend
    buildCommand: npm install
    startCommand: node --experimental-sqlite src/server.js
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: PORT
        value: 5000
      - key: SUPABASE_URL
        value: https://agggzpdbqvjiulqtzyrn.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable__8-Vwbf0J08_JQ3cu6ekUw_qX9p5LlW
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    healthCheckPath: /api/health

  # Admin Dashboard Static Site
  - type: web
    name: ework-dashboard
    env: static
    rootDir: Ework-clean/Ework/admin_dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://agggzpdbqvjiulqtzyrn.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable__8-Vwbf0J08_JQ3cu6ekUw_qX9p5LlW

  # Mobile App Web Portal Static Site
  - type: web
    name: ework-mobile
    env: static
    rootDir: Ework-clean/Ework/mobile_app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://agggzpdbqvjiulqtzyrn.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable__8-Vwbf0J08_JQ3cu6ekUw_qX9p5LlW
