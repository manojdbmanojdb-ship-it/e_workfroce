name: ework_mobile
description: Ework - Field Employee Tracking & Workforce Management App
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase & Auth
  supabase_flutter: ^2.3.0

  # State Management & Navigation
  flutter_riverpod: ^2.4.9
  go_router: ^13.2.0

  # Location, Geofencing & Maps
  geolocator: ^11.0.0
  google_maps_flutter: ^2.5.0

  # QR Code Verification
  mobile_scanner: ^4.0.0
  qr_flutter: ^4.1.0

  # Camera, Signatures & Proof of Work
  camera: ^0.10.5
  signature: ^5.4.0
  image_picker: ^1.0.7

  # Offline Storage & Cache
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Network & Sync
  http: ^1.2.0
  dio: ^5.4.0
  connectivity_plus: ^6.0.3

  # Utilities
  intl: ^0.20.3
  uuid: ^4.3.3
  permission_handler: ^11.3.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
